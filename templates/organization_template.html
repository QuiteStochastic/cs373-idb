{% extends "layout.html" %}
{% block body %}
<body>
  <!-- Image Background Page Header -->
  <header class="business-header" style="background: url(http://i.imgur.com/kCPmG4j.png) center center no-repeat scroll;">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <h1 class = "tagline">Organizations</h1>
          <p>Houses, military organizations, political factions.</p>
        </div>
      </div>
    </div>
  </header>
  <!-- Page Content -->  
  <div class ="container">
    <div class="col-sm-12">
      <ol class="breadcrumb">
        <li><a href="/">Home</a></li>
        <li><a href="/organizations">Organizations</a></li>
        <li id="breadcrumb_name"></li>
      </ol>
    </div>
  </div>

  <!-- /.row -->
  <div class="container">
    <div class="row pillars">
      <div class="col-sm-3 col-sm-offset-2">
        <h2 id="header_name"></h2>
        <img class="img-circle img-responsive img-center" src="../static/images/organizations/organization{{org_id}}.png" alt="">
      </div>
      
      <div class="col-sm-4">
        <h2>Attributes</h2>
        <ul class="list-group">
          <li class="list-group-item"><strong>Leader:</strong> <span id="leader"></span></li>
          <li class="list-group-item"><strong>Location:</strong> <span id="location"></span></li>
          <li class="list-group-item"><strong>Type:</strong> <span id="type"></span></li>
        </ul>
      </div>
    </div>
    
    <!-- DESCRIPTION -->
    <div class="row pillars">
      <div class="col-sm-8 col-sm-offset-2 description">
        <p id="description"></p>    
      </div>
    </div>
    
    <!-- RELATIONSHIPS -->
    <div class="row">
      <div class="col-sm-3 col-sm-offset-3">
        <h4>Members</h4>
      </div>
      <div class="col-sm-3">
        <h4>Events</h4>
      </div>
    </div>
    
    <div class="row">
      <div class="list-group col-sm-3 col-sm-offset-3" id="members"></div>
      <div class="list-group col-sm-3" id="events"></div>
    </div>
    
    <!-- /.row -->
  </div>
  <!-- /.container -->
</body>

<SCRIPT language="JavaScript" SRC="../static/js/pulldata.js"></SCRIPT> 
<script>  
    // Grab and set attributes that go into main body of page
    var info = get_one('organizations', {{org_id}});
    var result = JSON.parse(info);

    document.getElementById("breadcrumb_name").innerHTML = result.name;
    document.getElementById("header_name").innerHTML = result.name;
    document.getElementById("leader").innerHTML = result.leader_id; 
    document.getElementById("type").innerHTML = result.org_type; 
    document.getElementById("description").innerHTML = result.org_desc;   
  
    // Create link to location of organization
    var org_location = document.createElement("A");
    var location_name = document.createTextNode(result.location_name);
    org_location.setAttribute("href", "/locations/" + result.location_id);
    org_location.appendChild(location_name);
    document.getElementById("location").appendChild(org_location);
  
    // Create links to characters
    var characters, events;
    characters = result.members;
    events = result.partyto;
  
    for (var i = 0; i < characters.length; i++) {
      var character = characters[i];
      var link = document.createElement("A");
      var text = document.createTextNode(character.char_first_name + " " + character.char_last_name);
      link.setAttribute("class", "list-group-item");
      link.setAttribute("href", "/characters/" + character.char_id);
      link.appendChild(text);
      document.getElementById("members").appendChild(link);
    } 
  
    // Create links to events
    for (var i = 0; i < events.length; i++) {
      var event = events[i];
      var link = document.createElement("A");
      var text = document.createTextNode(event.name);
      link.setAttribute("class", "list-group-item");
      link.setAttribute("href", "/events/" + event.event_id);
      link.appendChild(text);
      document.getElementById("events").appendChild(link);
    }
  
</script>
{% endblock %}
