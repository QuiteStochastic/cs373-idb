<!-- using apiary to grab all character info -->

{% extends "layout.html" %}
{% block body %}
<body>
  <!-- Image Background Page Header -->
  <header class="business-header" style="background: url(http://i.imgur.com/kCPmG4j.png) center center no-repeat scroll;">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <h1 class = "tagline">Organizations</h1>
          <p>Houses, military organizations, political factions.</p>
        </div>
      </div>
    </div>
  </header>
  <!-- Page Content -->  
  <div class ="container">
    <div class="col-sm-12">
      <ol class="breadcrumb">
        <li><a href="/">Home</a></li>
        <li><a href="/organizations">Organizations</a></li>
        <li id="breadcrumb_name"></li>
      </ol>
    </div>
  </div>

  <!-- /.row -->
  <div class="container">
    <div class="row pillars">
      <div class="col-sm-3 col-sm-offset-2">
        <h2 id="header_name"></h2>
        <img class="img-circle img-responsive img-center" src="../static/images/organizations/org{{org_id}}.png" alt="">
      </div>
      
      <div class="col-sm-4">
        <h2>Attributes</h2>
        <ul class="list-group">
          <li class="list-group-item"><strong>Leader:</strong> <span id="leader"></span></li>
          <li class="list-group-item"><strong>Location:</strong> <span id="location"></span></li>
          <li class="list-group-item"><strong>Type:</strong> <span id="type"></span></li>
        </ul>
      </div>
    </div>
    
    <div class="row pillars">
      <div class="col-sm-8 col-sm-offset-2 description">
        <p id="description"></p>
        <p><em>- <a href="http://awoiaf.westeros.org/index.php/Main_Page">AWOIAF</a></em></p>     
      </div>
    </div>
    
    <!-- /.row -->
    <hr>
    <!-- Footer -->
    <footer>
      <div class="row">
        <div class="col-lg-12">
          <p>Copyright &copy; House Downing 2015</p>
        </div>
      </div>
      <!-- /.row -->
    </footer>
  </div>
  <!-- /.container -->
</body>

<SCRIPT language="JavaScript" SRC="../static/js/pulldata.js"></SCRIPT> 

<!-- pulling character info from apiary -->
<script>  
    var info = get_data('organizations');
    var result = JSON.parse(info);
    var index = {{org_id}} - 1;

    document.getElementById("breadcrumb_name").innerHTML = result[index].org_name;
    document.getElementById("header_name").innerHTML = result[index].org_name;
    document.getElementById("leader").innerHTML = result[index].leader_id; 
    document.getElementById("location").innerHTML = result[index].loc_id; 
    document.getElementById("type").innerHTML = result[index].org_type; 
    document.getElementById("description").innerHTML = result[index].org_description;   
</script>
{% endblock %}
