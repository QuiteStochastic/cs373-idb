{% extends "layout.html" %}
{% block body %}
<body>
  <!-- Image Background Page Header -->
  <!-- Note: The background image is set within the business-casual.css file. -->
  <header class="business-header" style="background: url(http://i.imgur.com/sg32xFm.jpg) center center no-repeat scroll;">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <h1 class = "tagline">Explore Westeros</h1>
          <p>Follow the characters and events of the series.</p>
        </div>
      </div>
    </div>
  </header>
  <!-- Page Content -->
  <div class="container">
    <div class="row">
      <div class="col-sm-8 col-sm-offset-1">
        <h2>Word of caution: <em>SPOILERS, EVERYWHERE.</em></h2>
      </div>
    </div>
    <hr>
    <!-- /.row -->
    <div class="row pillars" align="center">
      <div class="col-sm-6 col-sm-offset-3">
        <a href="/characters"><img class="img-thumbnail img-responsive img-center" src="http://www.exocube.com/wp-content/uploads/2014/09/placeholder-banner.png" alt=""></a>
        <p></p>
      </div>
      <div class="col-sm-6 col-sm-offset-3">
        <a href="/organizations"><img class="img-thumbnail img-responsive img-center" src="http://www.exocube.com/wp-content/uploads/2014/09/placeholder-banner.png" alt=""></a>
        <p></p>
      </div>
      <div class="col-sm-6 col-sm-offset-3">
        <a href="/locations"><img class="img-thumbnail img-responsive img-center" src="http://www.exocube.com/wp-content/uploads/2014/09/placeholder-banner.png" alt=""></a>
        <p></p>
      </div>
      <div class="col-sm-6 col-sm-offset-3">
        <a href="/events"><img class="img-thumbnail img-responsive img-center" src="http://www.exocube.com/wp-content/uploads/2014/09/placeholder-banner.png" alt=""></a>
        <p></p>
      </div>
      <div class="col-sm-6 col-sm-offset-3">
        <a href="/episodes"><img class="img-thumbnail img-responsive img-center" src="http://www.exocube.com/wp-content/uploads/2014/09/placeholder-banner.png" alt=""></a>
        <p></p>
      </div>
    </div>
    <hr>
    <div align="center">
     <a class="twitter-timeline" href="https://twitter.com/GameOfThrones" data-widget-id="589105183461769216">Tweets by @GameOfThrones</a> 
    </div>
    <!-- /.row -->
  </div>
  <!-- /.container -->
</body>
<script src="../static/js/twitter.js"></script>
{% endblock %}
