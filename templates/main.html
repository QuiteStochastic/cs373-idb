{% extends "layout.html" %}
{% block body %}
<body>
  <!-- Image Background Page Header -->
  <!-- Note: The background image is set within the business-casual.css file. -->
  <header class="business-header" style="background: url(http://i.imgur.com/sg32xFm.jpg) center center no-repeat scroll;">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <h1 class = "tagline">Explore Westeros</h1>
          <p>Follow the characters and events of the series.</p>
        </div>
      </div>
    </div>
  </header>
  <!-- Page Content -->
  <div class="container">
    <hr>
    <div class="row">
      <div class="col-sm-8">
        <h2>Word of caution: <em>SPOILERS, EVERYWHERE.</em></h2>
      </div>
    </div>
    <!-- /.row -->
    <hr>
    <div class="row pillars">
      <div class="col-sm-4">
        <a href="/characters"><img class="img-circle img-responsive img-center" src="http://i.imgur.com/XGnVaOk.png" alt=""></a>
        <h2>Characters</h2>
        <p></p>
      </div>
      <div class="col-sm-4">
        <a href="/organizations"><img class="img-circle img-responsive img-center" src="http://i.imgur.com/0Muv0nb.png" alt=""></a>
        <h2>Organizations</h2>
        <p></p>
      </div>
      <div class="col-sm-4">
        <a href="/locations"><img class="img-circle img-responsive img-center" src="http://i.imgur.com/rkW829H.png" alt=""></a>
        <h2>Locations</h2>
        <p></p>
      </div>
      <div class="col-sm-4 col-sm-offset-4">
        <a href="/events"><img class="img-circle img-responsive img-center" src="http://i.imgur.com/0GUDGeC.png" alt=""></a>
        <h2>Events</h2>
        <p></p>
      </div>
    </div>
    <!-- /.row -->
    <hr>
    <!-- Footer -->
    <footer>
      <div class="row">
        <div class="col-lg-12">
          <p>Copyright &copy; House Downing 2015</p>
        </div>
      </div>
      <!-- /.row -->
    </footer>
  </div>
  <!-- /.container -->
</body>
{% endblock %}
