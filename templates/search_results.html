{% extends "layout.html" %}
{% block body %}
<body>
  <!-- Image Background Page Header -->
  <!-- Note: The background image is set within the business-casual.css file. -->
  <header class="business-header" style="background: url(http://i.imgur.com/qeHP6FV.jpg?2) center top no-repeat scroll;">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <h1 class = "tagline">Search Results</h1>
          <p>Hodor Hodor Huh.</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Page Content -->
  <div class ="container">
    <div class="col-sm-12">
      <ol class="breadcrumb">
        <li><a href="/">Home</a></li>
        <li>Search Results</li>
      </ol>
    </div>
  </div> 

<!-- Container Div -->
	<div class="container">

		<!-- Search Bar -->
		<div class="row"> 
			<div class="col-lg-6">
				<div class="input-group">
					<input type="text" class="form-control" placeholder="Search for...">
					<span class="input-group-btn">
						<button class="btn btn-default" type="button">Go!</button>
					</span>
				</div><!-- /input-group -->
			</div><!-- /.col-lg-6 -->
		</div>

		<hr>
		<!-- Search Results -->
		<table class="table table-hover">
  		<thead>
  		<tr>
  			<th>#</th>
  			<th>Pillar</th>
  			<th>Name</th>
  			<th>Description</th>
  		</tr>
  		</thead>

  		<tbody id="table_results">
  		</tbody>
		</table>

	</div>
</body>
  <!-- CONTAINER END -->
<script language="JavaScript" src="../static/js/pulldata.js"></script> 
<script>
	var info = get_data('search?query={{query}}');
	var result = JSON.parse(info);
	var results = result["results"];

	for (var i = 0; i < results.length; i++) {
		// Create table row
		var row = document.createElement("TR");
		
		// Create table data
		var num = document.createElement("TD");
		var pillar = document.createElement("TD");
		var name = document.createElement("TD");
		var desc = document.createElement("TD");

		// Grab values for table data		
		var num_text = document.createTextNode((i + 1).toString());
		var pillar_text = document.createTextNode(results[i]["type"]);
		var name_text = document.createTextNode(results[i]["name"]);
		var desc_text = document.createTextNode(results[i]["desc"]);	

		// Insert values into table data
		num.appendChild(num_text);
		pillar.appendChild(pillar_text);
		name.appendChild(name_text);
		desc.appendChild(desc_text);
		
	}
  	alert(info);
</script>
{% endblock %}
