{% extends "layout.html" %}
{% block body %}
<body>
  <!-- Image Background Page Header -->
  <!-- Note: The background image is set within the business-casual.css file. -->
  <header class="business-header" style="background: url(http://i.imgur.com/eYs2yBj.png) center center no-repeat scroll;">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <h1 class = "tagline">Locations</h1>
          <p>Castles, cities, and other landmarks.</p>
        </div>
      </div>
    </div>
  </header>
  <!-- Page Content -->
  <div class ="container">
    <div class="col-sm-12">
      <ol class="breadcrumb">
        <li><a href="/">Home</a></li>
        <li>Locations</li>
      </ol>
    </div>
  </div>
  <div class="container">
    <hr>
    <div class="row">
      <div class="col-sm-8">
        <h2>(Placeholder for dynamic table)</h2>
        <p></p>
      </div>
    </div>
    <!-- /.row -->
    <hr>
    <div class="row pillars" id="test">
    </div>
    <!-- /.row -->
    <hr>
    <!-- Footer -->
    <footer>
      <div class="row">
        <div class="col-lg-12">
          <p>Copyright &copy; House Downing 2015</p>
        </div>
      </div>
      <!-- /.row -->
    </footer>
  </div>
  <!-- /.container -->
</body>

<SCRIPT language="JavaScript" SRC="../static/js/pulldata.js"></SCRIPT> 
<script>  
    var info = get_data('locations');
    var result = JSON.parse(info);
   
    for (var i = 1; i <= result.length; i++) {
      var div = document.createElement("DIV");   
      var href = document.createElement("A");
      var img = document.createElement("IMG");
      var h2 = document.createElement("H2");
      var text = document.createTextNode(result[i-1].location_name);
  
      div.setAttribute("class", "col-sm-4");
      href.setAttribute("href", "/locations/" + i);
      img.setAttribute("src", "static/images/locations/location" + i + ".png");
      img.setAttribute("class", "img-circle img-responsive img-center");
      h2.appendChild(text);
  
      href.appendChild(img);
      div.appendChild(href);
      div.appendChild(h2);
  
    document.getElementById("test").appendChild(div);      
  }
</script>
{% endblock %}
