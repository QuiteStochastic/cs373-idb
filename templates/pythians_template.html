{% extends "layout.html" %}
{% block body %}
<body>
  <div class="container">
    <table class="row table table-hover tablesorter" id="tableView">
      <thead>
        <tr>
          <th>Country</th>
          <th>Male Name</th>
          <th>Male Total</th>
          <th>Female Name</th>
          <th>Female Total</th>
        </tr>
      </thead>
    
      <tbody>
        {% for key, value in result.items() %}
        <tr class="clickable-row">
          <td>{{key}}</td>
          <td>{{value["male_name"]}}</td>
          <td>{{value["male_total"]}}</td>
          <td>{{value["female_name"]}}</td>
          <td>{{value["female_total"]}}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>

<script>
  $("#tableView").tablesorter(); 
</script>
{% endblock %}
