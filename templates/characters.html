{% extends "layout.html" %}
{% block body %}
<body>
  <!-- Image Background Page Header -->
  <!-- Note: The background image is set within the business-casual.css file. -->
  <header class="business-header" style="background: url(http://i.imgur.com/kCPmG4j.png) center center no-repeat scroll;">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <h1 class = "tagline">Characters</h1>
          <p>Players in the Game of Thrones.</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Page Content -->
  <div class ="container">
    <div class="col-sm-12">
      <ol class="breadcrumb">
        <li><a href="/">Home</a></li>
        <li>Characters</li>
      </ol>
    </div>
  </div>

  <!-- CONTAINER -->
  <div class="container">
    
    <!-- Toggle Button -->
    <div class="buttons col-md-10 col-md-offset-2">
      <button class="grid"><span class="glyphicon glyphicon-th" aria-hidden="true"></span></button>
      <button class="table-hover"><span class="glyphicon glyphicon-th-list" aria-hidden="true"></span></button>
    </div>
    
    <!-- Picture Grid -->
    <div class="row pic-grid">
      <div class="row pillars" id="content"></div>
   </div>

    <!-- Table -->
    <table class="row table table-hover hide">
      <thead>
      <tr>
        <th>#</th>
        <th></th>
        <th>Name</th>
        <th>Type</th>
        <th>Gender</th>
        <th>Religion</th>
        <th>Status</th>
        </tr>
      </thead>
    
      <tbody>
      {% for x in range(1,33) %}
      <tr class=" clickable-row" id="table-row{{x}}">
        <th scope="row" id="id{{x}}"></th>
        <td><div class="img-circle" id="img{{x}}"></div></td>
        <td id="firstname{{x}}"></td>
        <td id="lastname{{x}}"></td>
        <td id="gender{{x}}"></td>
        <td id="religion{{x}}"></td>
        <td id="status{{x}}"></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
<!-- END CONTAINER -->
</body>

<SCRIPT language="JavaScript" SRC="../static/js/pulldata.js"></SCRIPT> 
<script>  
    var info = get_data('characters');
    var result = JSON.parse(info);
   
    for (var i = 1; i <= result.length; i++) {
      var name = result[i-1].last_name === null ? result[i-1].first_name : result[i-1].first_name + ' ' + result[i-1].last_name;
      var div = document.createElement("DIV");   
      var href = document.createElement("A");
      var img = document.createElement("IMG");
      var h2 = document.createElement("H2");
      var text = document.createTextNode(name);
  
      div.setAttribute("class", "col-sm-4");
      href.setAttribute("href", "/characters/" + i);
      img.setAttribute("src", "static/images/characters/character" + i + ".png");
      img.setAttribute("class", "img-circle img-responsive img-center");
      h2.appendChild(text);
  
      href.appendChild(img);
      div.appendChild(href);
      div.appendChild(h2);
      
      // populate grid view
      document.getElementById("content").appendChild(div);
      
      // populate table view
      document.getElementById("id" + i).innerHTML = i;
      document.getElementById("firstname" + i).innerHTML = result[i-1].first_name;
      document.getElementById("lastname" + i).innerHTML = result[i-1].last_name;
      document.getElementById("gender" + i).innerHTML = result[i-1].gender;
      document.getElementById("religion" + i).innerHTML = result[i-1].religion;
      document.getElementById("status" + i).innerHTML = result[i-1].status;

      var table_img = document.createElement("IMG");
      table_img.setAttribute("class", "img-circle");
      table_img.setAttribute("src", "static/images/characters/character" + i + ".png");
      document.getElementById("img" + i).appendChild(table_img);

      document.getElementById("table-row" + i).setAttribute("data-href", "/characters/" + i);

  }
</script>
{% endblock %}
