{% extends "layout.html" %}
{% block body %}
<body>
  <!-- Image Background Page Header -->
  <!-- Note: The background image is set within the business-casual.css file. -->
  <header class="business-header" style="background: url(http://i.imgur.com/4d1Y61N.png) center center no-repeat scroll;">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <h1 class = "tagline">Events</h1>
          <p>Battles, deaths, weddings.</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Page Content -->
  <div class ="container">
    <div class="col-sm-12">
      <ol class="breadcrumb">
        <li><a href="/">Home</a></li>
        <li>Events</li>
      </ol>
    </div>
  </div>

  <!-- CONTAINER -->
  <div class="container">
   
    <!-- Toggle Button -->
    <div class="buttons col-md-10 col-md-offset-2">
      <button class="grid"><span class="glyphicon glyphicon-th" aria-hidden="true"></span></button>
      <button class="table-hover"><span class="glyphicon glyphicon-th-list" aria-hidden="true"></span></button>
    </div>
    
    <div class="row pic-grid">
      <div class="row pillars">
        {% for event in result %}
          <div class="col-sm-4">
            <a href="/events/{{event.event_id}}">
              <img class="img-circle img-responsive img-center" src="static/images/events/event{{event.event_id}}.png">
            </a>
            <h2>{{event.name}}</h2>
          </div>
        {% endfor %}
      </div>
    </div>

    <!-- Table -->
    <table class="row table table-hover hide tablesorter" id="tableView">
      <thead>
      <tr>
        <th>#</th>
        <th></th>
        <th>Name</th>
	<th>Type</th>
      </tr>
      </thead>
    
      <tbody>
      {% for event in result %}
        <tr class="clickable-row" data-href="/events/{{event.event_id}}">
          <td>{{event.event_id}}</td>
          <td><div><img class="img-circle" src="static/images/events/event{{event.event_id}}.png"></div></td>
          <td>{{event.name}}</td>
	  <td>{{event.event_type}}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
    <!-- TABLE END -->
    
  </div>
  <!-- CONTAINER END -->
</body>

<script>
  $("#tableView").tablesorter(); 
</script>
{% endblock %}
