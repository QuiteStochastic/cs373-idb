{% extends "layout.html" %}
{% block body %}
<body>
  <!-- Image Background Page Header -->
  <!-- Note: The background image is set within the business-casual.css file. -->
  <header class="business-header" style="background: url(http://i.imgur.com/4d1Y61N.png) center center no-repeat scroll;">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <h1 class = "tagline">Events</h1>
          <p>Battles, deaths, weddings.</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Page Content -->
  <div class ="container">
    <div class="col-sm-12">
      <ol class="breadcrumb">
        <li><a href="/">Home</a></li>
        <li>Events</li>
      </ol>
    </div>
  </div>

  <!-- CONTAINER -->
  <div class="container">
   
    <!-- Toggle Button -->
    <div class="buttons col-md-10 col-md-offset-2">
      <button class="grid"><span class="glyphicon glyphicon-th" aria-hidden="true"></span></button>
      <button class="table-hover"><span class="glyphicon glyphicon-th-list" aria-hidden="true"></span></button>
    </div>
    
    <div class="row pic-grid">
      <div class="row pillars" id="content"></div>
    </div>

    <!-- Table -->
    <table class="row table table-hover hide tablesorter" id="tableView">
      <thead>
      <tr>
        <th>#</th>
        <th></th>
        <th>Name </th>
      </tr>
      </thead>
    
      <tbody>
      {% for event in result %}
        <tr class="clickable-row" data-href="/events/{{event["id"]}}">
          <td>{{event["id"]}}</td>
          <td><div><img class="img-circle" src="static/images/events/event{{event["id"]}}.png"></div></td>
          <td>{{event["name"]}}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
    <!-- TABLE END -->
    
  </div>
  <!-- CONTAINER END -->
</body>

<script>  
    var info = get_data('events');
    var result = JSON.parse(info);

    for (var i = 1; i <= result.length; i++) {
      var div = document.createElement("DIV");   
      var href = document.createElement("A");
      var img = document.createElement("IMG");
      var h2 = document.createElement("H2");
      var text = document.createTextNode(result[i-1].name);
  
      div.setAttribute("class", "col-sm-4");
      href.setAttribute("href", "/events/" + i);
      img.setAttribute("src", "static/images/events/event" + i + ".png");
      img.setAttribute("class", "img-circle img-responsive img-center");
      h2.appendChild(text);
  
      href.appendChild(img);
      div.appendChild(href);
      div.appendChild(h2);
  
      // populate grid view
      document.getElementById("content").appendChild(div);      
    }
</script>
<script>
  $("#tableView").tablesorter(); 
</script>
{% endblock %}
