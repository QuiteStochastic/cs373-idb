{% extends "layout.html" %}
{% block body %}
<body>
  <!-- Image Background Page Header -->
  <header class="business-header" style="background: url(http://i.imgur.com/4d1Y61N.png) center center no-repeat scroll;">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <h1 class = "tagline">Events</h1>
          <p>Battles, deaths, weddings.</p>
        </div>
      </div>
    </div>
  </header>
  <!-- Page Content -->  
  <div class ="container">
    <div class="col-sm-12">
      <ol class="breadcrumb">
        <li><a href="/">Home</a></li>
        <li><a href="/events">Events</a></li>
        <li id="breadcrumb_name"></li>
      </ol>
    </div>
  </div>

  <!-- /.row -->
  <div class="container">
    <div class="row pillars">
      <div class="col-sm-3 col-sm-offset-2">
        <h2 id="header_name"></h2>
        <img class="img-circle img-responsive img-center" src="../static/images/events/event{{event_id}}.png" alt="">
      </div>
      
      <div class="col-sm-4">
        <h2>Attributes</h2>
        <ul class="list-group">
          <li class="list-group-item"><strong>Location:</strong> <span id="location"></span></li>
          <li class="list-group-item"><strong>Type:</strong> <span id="type"></span></li>
        </ul>
      </div>
    </div>
    
    <!-- DESCRIPTION -->
    <div class="row pillars">
      <div class="col-sm-8 col-sm-offset-2 description">
        <p id="description"></p>
        <p><em>- <a href="http://awoiaf.westeros.org/index.php/Main_Page">AWOIAF</a></em></p>    
      </div>
    </div>
    
    <!-- RELATIONSHIPS -->
    <div class="row">
      <div class="col-sm-3 col-sm-offset-3">
        <h4>Characters</h4>
      </div>
      <div class="col-sm-3">
        <h4>Organizations</h4>
      </div>
    </div>
    
    <div class="row">
      <div class="list-group col-sm-3 col-sm-offset-3" id="participants">
      </div>
      <div class="list-group col-sm-3" id="parties">
      </div>
    </div>
    
    <!-- /.row -->
  </div>
  <!-- /.container -->
</body>

<SCRIPT language="JavaScript" SRC="../static/js/pulldata.js"></SCRIPT> 
<script>  
    var info = get_one('events', {{event_id}});
    var result = JSON.parse(info);
  
    // Grab attributes that go into main body of page
    document.getElementById("breadcrumb_name").innerHTML = result.name;
    document.getElementById("header_name").innerHTML = result.name;
    document.getElementById("location").innerHTML = result.location_id; 
    document.getElementById("type").innerHTML = result.event_type; 
    document.getElementById("description").innerHTML = result.event_description; 
  
    // Create links to characters
    var participants, parties;
    participants = result.participants;
    parties = result.parties;
  
    for (var i = 0; i < participants.length; i++) {
      var participant = participants[i];
      var link = document.createElement("A");
      var text = document.createTextNode(participant.first_name + " " + participant.last_name);
      link.setAttribute("class", "list-group-item");
      link.setAttribute("href", "/characters/" + participant.char_id);
      link.appendChild(text);
      document.getElementById("participants").appendChild(link);
    }  
  
    // Create links to organizations
    for (var i = 0; i < parties.length; i++) {
      var party = parties[i];
      var link = document.createElement("A");
      var text = document.createTextNode(party.name);
      link.setAttribute("class", "list-group-item");
      link.setAttribute("href", "/organizations/" + party.org_id);
      link.appendChild(text);
      document.getElementById("parties").appendChild(link);
    } 
  
</script>
{% endblock %}
