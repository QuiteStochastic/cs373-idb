{% extends "layout.html" %}
{% block body %}
<body>
  <!-- Image Background Page Header -->
  <!-- Note: The background image is set within the business-casual.css file. -->
  <header class="business-header" style="background: url(http://i.imgur.com/NXqcDBA.jpg?1) center center no-repeat scroll;">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <h1 class = "tagline">Organizations</h1>
          <p>Houses, military organizations, and political factions.</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Page Content -->
  <div class ="container">
    <div class="col-sm-12">
      <ol class="breadcrumb">
        <li><a href="/">Home</a></li>
        <li>Organizations</li>
      </ol>
    </div>
  </div>

  <!-- CONTAINER -->
  <div class="container">

    <!-- Toggle Button -->
    <div class="buttons col-md-10 col-md-offset-2">
      <button class="grid"><span class="glyphicon glyphicon-th" aria-hidden="true"></span></button>
      <button class="table-hover"><span class="glyphicon glyphicon-th-list" aria-hidden="true"></span></button>
    </div>

    <!-- Picture Grid -->
    <div class="row pic-grid">
      <div class="row pillars" id="content"></div>
    </div>
    
    <!-- Table -->
    <table class="row table table-hover hide">
      <thead>
      <tr>
        <th>#</th>
        <th></th>
        <th>Name</th>
        <th>Type</th>
       </tr>
      </thead>
    
      <tbody>
      {% for x in range(1,14) %}
      <tr class="clickable-row" id="table-row{{x}}">
        <th scope="row" id="id{{x}}"></th>
        <td><div class="img-circle" id="img{{x}}"></div></td>
        <td id="name{{x}}"></td>
        <td id="type{{x}}"></td>
      </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
  <!-- CONTAINER END -->

</body>
<SCRIPT language="JavaScript" SRC="../static/js/pulldata.js"></SCRIPT> 
<script>  
    var info = get_data('organizations');
    var result = JSON.parse(info);
   
    for (var i = 1; i <= result.length; i++) {
      var div = document.createElement("DIV");   
      var href = document.createElement("A");
      var img = document.createElement("IMG");
      var h2 = document.createElement("H2");
      var text = document.createTextNode(result[i-1].org_name);
  
      div.setAttribute("class", "col-sm-4");
      href.setAttribute("href", "/organizations/" + i);
      img.setAttribute("src", "static/images/organizations/organization" + i + ".png");
      img.setAttribute("class", "img-circle img-responsive img-center");
      h2.appendChild(text);
  
      href.appendChild(img);
      div.appendChild(href);
      div.appendChild(h2);
  
      // populate grid view
      document.getElementById("content").appendChild(div);    
      
      // populate table view
      document.getElementById("id" + i).innerHTML = i;
      document.getElementById("name" + i).innerHTML = result[i-1].org_name;
      document.getElementById("type" + i).innerHTML = result[i-1].org_type;
      var table_img = document.createElement("IMG");
      table_img.setAttribute("class", "img-circle");
      table_img.setAttribute("src", "static/images/organizations/organization" + i + ".png");
      document.getElementById("img" + i).appendChild(table_img);

      document.getElementById("table-row" + i).setAttribute("data-href", "/organizations/" + i);
  }
</script>
{% endblock %}
