{% extends "layout.html" %}
{% block body %}
<body>
  <!-- Image Background Page Header -->
  <header class="business-header" style="background: url(http://i.imgur.com/kCPmG4j.png) center center no-repeat scroll;">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <h1 class = "tagline">Characters</h1>
          <p></p>
        </div>
      </div>
    </div>
  </header>
  <!-- Page Content -->  
  <div class ="container">
    <div class="col-sm-12">
      <ol class="breadcrumb">
        <li><a href="/">Home</a></li>
        <li><a href="/characters">Characters</a></li>
        <li id="breadcrumb_name"></li>
      </ol>
    </div>
  </div>

  <!-- /.row -->
  <div class="container">
    <div class="row pillars">
      <div class="col-sm-3 col-sm-offset-2">
        <h2 id="header_name"></h2>
        <img class="img-circle img-responsive img-center" src="../static/images/characters/character{{char_id}}.png" alt="">
      </div>

      <div class="col-sm-4">
        <h2>Attributes</h2>
        <ul class="list-group">
          <li class="list-group-item"><strong>Alias:</strong> <span id="alias"></span></li>
          <li class="list-group-item"><strong>Gender:</strong> <span id="gender"></span></li>
          <li class="list-group-item"><strong>Religion:</strong> <span id="religion"></span></li>
          <li class="list-group-item"><strong>Status:</strong> <span id="status"></span></li>
        </ul>
      </div>
    </div>
    
    <!-- DESCRIPTION -->
    <div class="row pillars">
      <div class="col-sm-8 col-sm-offset-2 description">
        <p id="description"></p>
        <p><em>- <a href="http://awoiaf.westeros.org/index.php/Main_Page">AWOIAF</a></em></p> 
      </div>
    </div>
    
    <!-- RELATIONSHIPS --> 
    <div class="row">
      <div class="col-sm-2 col-sm-offset-3">
        <h4>Affiliations</h4>
      </div>
      <div class="col-sm-2">
        <h4>Locations</h4>
      </div>
      <div class="col-sm-2">
        <h4>Events</h4>
      </div>
    </div>
    
    <div class="row">
      <div class="list-group col-sm-2 col-sm-offset-3" id="affiliations"></div>
      <div class="list-group col-sm-2" id="locations"></div>
      <div class="list-group col-sm-2" id="events"></div>
    </div>
    
  </div>
  <!-- /.container -->
</body>

<script src="../static/js/pulldata.js"></script>
<script> 
    var info = get_one('characters', {{char_id}});
    var result = JSON.parse(info);
    
    // Grab attributes that go into main body of page
    var name, alias, religion;
    name = result.last_name === null ? result.first_name : result.first_name + ' ' + result.last_name;
    alias = result.alias === null ? 'n/a' : result.alias;
    religion = result.religion === null ? 'n/a' : result.religion;

    document.getElementById("breadcrumb_name").innerHTML = name;
    document.getElementById("header_name").innerHTML = name;
    document.getElementById("alias").innerHTML = alias;
    document.getElementById("gender").innerHTML = result.gender; 
    document.getElementById("religion").innerHTML = religion;
    document.getElementById("status").innerHTML = result.status; 
    document.getElementById("description").innerHTML = result.description;
  
    // Create links to organizations
    var affiliations, locations, events;
    affiliations = result.affiliations;
    locations = result.visited;
    events = result.events;

    for (var i = 0; i < affiliations.length; i++) {
      var affiliation = affiliations[i];
      var link = document.createElement("A");
      var text = document.createTextNode(affiliation.org_name);
      link.setAttribute("class", "list-group-item");
      link.setAttribute("href", "/organizations/" + affiliation.org_id);
      link.appendChild(text);
      document.getElementById("affiliations").appendChild(link);
    }    
  
    // Create links to locations
    for (var i = 0; i < locations.length; i++) {
      var location = locations[i];
      var link = document.createElement("A");
      var text = document.createTextNode(location.name);
      link.setAttribute("class", "list-group-item");
      link.setAttribute("href", "/locations/" + location.loc_id);
      link.appendChild(text);
      document.getElementById("locations").appendChild(link);
    }  
  
//     // Create links to events
//     for (var i = 0; i < events.length; i++) {
//       var event = events[i];
//       var link = document.createElement("A");
//       var text = document.createTextNode(event.name);
//       link.setAttribute("class", "list-group-item");
//       link.setAttribute("href", "/events/" + event.event_id);
//       link.appendChild(text);
//       document.getElementById("events").appendChild(link);
//     }  
</script>
{% endblock %}
