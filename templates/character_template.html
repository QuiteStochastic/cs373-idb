<!-- using apiary to grab all character info -->

{% extends "layout.html" %}
{% block body %}
<body>
  <!-- Image Background Page Header -->
  <header class="business-header" style="background: url(http://i.imgur.com/kCPmG4j.png) center center no-repeat scroll;">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <h1 class = "tagline">Characters</h1>
          <p></p>
        </div>
      </div>
    </div>
  </header>
  <!-- Page Content -->  
  <div class ="container">
    <div class="col-sm-12">
      <ol class="breadcrumb">
        <li><a href="/">Home</a></li>
        <li><a href="/characters">Characters</a></li>
        <li id="breadcrumb_name"></li>
      </ol>
    </div>
  </div>

  <!-- /.row -->
  <div class="container">
    <div class="row pillars">
      <div class="col-sm-3 col-sm-offset-2">
        <h2 id="header_name"></h2>
        <img class="img-circle img-responsive img-center" src="../static/images/characters/character{{char_id}}.png" alt="">
      </div>

      <div class="col-sm-4">
        <h2>Attributes</h2>
        <ul class="list-group">
          <li class="list-group-item"><strong>Alias:</strong> <span id="alias"></span></li>
          <li class="list-group-item"><strong>Gender:</strong> <span id="gender"></span></li>
          <li class="list-group-item"><strong>Religion:</strong> <span id="religion"></span></li>
          <li class="list-group-item"><strong>Status:</strong> <span id="status"></span></li>
        </ul>
      </div>
    </div>
    
    <div class="row pillars">
      <div class="col-sm-8 col-sm-offset-2 description">
        <p id="description"></p>
        <p><em>- <a href="http://awoiaf.westeros.org/index.php/Main_Page">AWOIAF</a></em></p> 
      </div>
    </div>
    
    <!-- /.row -->
    <hr>
    <!-- Footer -->
    <footer>
      <div class="row">
        <div class="col-lg-12">
          <p>Copyright &copy; House Downing 2015</p>
        </div>
      </div>
      <!-- /.row -->
    </footer>
  </div>
  <!-- /.container -->
</body>

<script src="../static/js/pulldata.js"></script>
<script> 
    var info = get_data('characters');
    var result = JSON.parse(info);
    var index = {{char_id}} - 1;
    var name, alias, religion;
  
    name = result[index].last_name === null ? result[index].first_name : result[index].first_name + ' ' + result[index].last_name;;
    alias = result[index].alias === null ? 'n/a' : result[index].alias;
    religion = result[index].religion === null ? 'n/a' : result[index].religion;

    document.getElementById("breadcrumb_name").innerHTML = name;
    document.getElementById("header_name").innerHTML = name;
    document.getElementById("alias").innerHTML = alias;
    document.getElementById("gender").innerHTML = result[index].gender; 
    document.getElementById("religion").innerHTML = religion;
    document.getElementById("status").innerHTML = result[index].status; 
    document.getElementById("description").innerHTML = result[index].description;
</script>
{% endblock %}
